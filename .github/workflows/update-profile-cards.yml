name: Update Profile Cards

on:
  push:
    branches: [master]
    paths:
      - "scripts/generate_profile_cards.py"
      - ".github/workflows/update-profile-cards.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate self-hosted cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_cards.py

      - name: Enforce self-hosted cards and spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("README.md")
          s = p.read_text(encoding="utf-8")

          # Replace any remaining third-party stats-card images with local SVGs.
          s = re.sub(
              r'<img[^>]*src="https://github-profile-summary-cards\\.vercel\\.app/api/cards/repos-per-language[^>]*>',
              '<img width="900" src="./assets/top-languages.svg" alt="Top Languages" />',
              s,
          )
          s = re.sub(
              r'<img[^>]*src="https://github-readme-activity-graph\\.vercel\\.app/graph[^>]*>',
              '<img width="900" src="./assets/activity.svg" alt="Contribution Activity" />',
              s,
          )

          # Normalize the complete stats section so spacing and widths stay consistent.
          start = s.find("## 📊 GitHub Stats")
          end = s.find("## 🤝 Let's Connect", start)
          if start != -1 and end != -1:
              section = '''## 📊 GitHub Stats

<div align="center">

<img width="900" src="./assets/github-stats.svg" alt="GitHub Stats" />

<br/>

<img width="900" src="./assets/top-languages.svg" alt="Top Languages" />

<br/>

<img width="900" src="./assets/activity.svg" alt="Contribution Activity" />

</div>

'''
              s = s[:start] + section + s[end:]

          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify no third-party stats cards remain
        run: |
          if grep -Eq 'github-profile-summary-cards\\.vercel\\.app|github-readme-activity-graph\\.vercel\\.app|github-readme-stats\\.vercel\\.app|github-readme-streak-stats\\.' README.md; then
            echo "Third-party stats card URL still present in README.md"
            exit 1
          fi
          test -f assets/github-stats.svg
          test -f assets/top-languages.svg
          test -f assets/activity.svg

      - name: Commit updated cards and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg assets/top-languages.svg assets/activity.svg
          git diff --cached --quiet || git commit -m "fix: use self-hosted profile cards"
          git push
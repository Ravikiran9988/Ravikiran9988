name: Update GitHub Profile Stats

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate accurate stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import datetime
          import html
          import os
          import re
          import requests
          from pathlib import Path

          login = "Ravikiran9988"
          now = datetime.datetime.now(datetime.timezone.utc)
          start = datetime.datetime(now.year, 1, 1, tzinfo=datetime.timezone.utc)

          query = """
          query($login:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$login) {
              followers { totalCount }
              repositories(first:100, ownerAffiliations:OWNER, privacy:PUBLIC, isFork:false) {
                totalCount
                nodes { stargazerCount }
              }
              contributionsCollection(from:$from, to:$to) {
                contributionCalendar { totalContributions }
              }
            }
          }
          """

          response = requests.post(
              "https://api.github.com/graphql",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
              },
              json={
                  "query": query,
                  "variables": {
                      "login": login,
                      "from": start.isoformat().replace("+00:00", "Z"),
                      "to": now.isoformat().replace("+00:00", "Z"),
                  },
              },
              timeout=30,
          )
          response.raise_for_status()
          payload = response.json()
          if payload.get("errors"):
              raise RuntimeError(payload["errors"])

          user = payload["data"]["user"]
          repos = user["repositories"]
          contributions = user["contributionsCollection"]["contributionCalendar"]["totalContributions"]
          followers = user["followers"]["totalCount"]
          stars = sum(repo["stargazerCount"] for repo in repos["nodes"])
          public_repos = repos["totalCount"]
          year = now.year

          def esc(value):
              return html.escape(str(value))

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0d1117"/>
              <stop offset="100%" stop-color="#161b22"/>
            </linearGradient>
          </defs>
          <rect width="900" height="250" rx="18" fill="url(#bg)" stroke="#30363d"/>
          <text x="45" y="52" fill="#58a6ff" font-family="Arial,sans-serif" font-size="26" font-weight="700">GitHub Stats</text>
          <text x="45" y="80" fill="#8b949e" font-family="Arial,sans-serif" font-size="14">Live data • updated daily • {year} contributions</text>
          <g font-family="Arial,sans-serif">
            <text x="55" y="125" fill="#8b949e" font-size="13">Contributions ({year})</text>
            <text x="55" y="158" fill="#f0f6fc" font-size="28" font-weight="700">{esc(contributions)}</text>
            <text x="260" y="125" fill="#8b949e" font-size="13">Public Repositories</text>
            <text x="260" y="158" fill="#f0f6fc" font-size="28" font-weight="700">{esc(public_repos)}</text>
            <text x="465" y="125" fill="#8b949e" font-size="13">Stars Earned</text>
            <text x="465" y="158" fill="#f0f6fc" font-size="28" font-weight="700">{esc(stars)}</text>
            <text x="670" y="125" fill="#8b949e" font-size="13">Followers</text>
            <text x="670" y="158" fill="#f0f6fc" font-size="28" font-weight="700">{esc(followers)}</text>
          </g>
          <text x="45" y="210" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Source: GitHub GraphQL API • Ravikiran9988</text>
          </svg>'''

          Path("assets").mkdir(exist_ok=True)
          Path("assets/github-stats.svg").write_text(svg, encoding="utf-8")

          readme = Path("README.md").read_text(encoding="utf-8")
          pattern = re.compile(r"## 📊 GitHub Stats\n\n<div align=\"center\">.*?</div>", re.S)
          replacement = '''## 📊 GitHub Stats\n\n<div align="center">\n\n<img width="900" src="./assets/github-stats.svg" alt="GitHub Stats" />\n\n<img height="180em" src="https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=Ravikiran9988&theme=tokyonight&exclude=Jupyter%20Notebook" />\n\n<br/><br/>\n\n<img width="100%" src="https://github-readme-activity-graph.vercel.app/graph?username=Ravikiran9988&theme=tokyo-night&hide_border=true&radius=10&color=00c2ff&line=00c2ff&point=f72585" />\n\n</div>'''
          updated, count = pattern.subn(replacement, readme, count=1)
          if count != 1:
              raise RuntimeError("GitHub Stats section not found")
          Path("README.md").write_text(updated, encoding="utf-8")
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "No stats changes."
          else
            git commit -m "chore: update GitHub profile stats"
            git push
          fi
